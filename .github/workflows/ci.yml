name: Build and Test

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: make vet
      - name: Test
        run: make test

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Package
        run: make package
      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: antimatter-push-proxy
          path: dist/*.tar.gz

  # Builds the image on every change; publishes ghcr.io/antimatterchat/push-proxy
  # for main and for release tags.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push' && github.repository_owner == 'AntimatterChat'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and publish)
        run: |
          tag=latest
          case "$GITHUB_REF" in refs/tags/v*) tag="${GITHUB_REF#refs/tags/v}";; esac
          push=
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REPOSITORY_OWNER" = AntimatterChat ]; then push=1; fi
          make docker-buildx DOCKER_IMAGE=ghcr.io/antimatterchat/push-proxy APP_VERSION="$tag" PUSH="$push"
